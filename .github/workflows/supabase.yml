name: Supabase (Datenbank + Edge Functions)

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

env:
  PROJECT_REF: ttdagcbqqwjowhunrpjo

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Secrets vorhanden?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN oder SUPABASE_DB_PASSWORD fehlt in den Repo-Secrets – Deploy übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest

      - name: Projekt verknüpfen
        if: steps.check.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Datenbank-Migrationen
        if: steps.check.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Edge Functions
        if: steps.check.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
